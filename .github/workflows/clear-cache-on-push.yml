# GitHub Actions workflow to clear cache and trigger Streamlit update on code push
# This ensures that code changes are immediately reflected in the deployed Streamlit app

name: Clear Cache and Update Streamlit

on:
  push:
    branches:
      - main
      - master
    # Only trigger on changes that affect the app functionality
    paths:
      - 'app/**'
      - 'services/**'
      - 'core/**'
      - 'tsr_generator/**'
      - 'utils/**'
      - 'anyror/**'
      - 'api/**'
      - 'requirements*.txt'
      - 'Dockerfile*'
      - 'cloudbuild.yaml'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_clear:
        description: 'Force clear all DOCX cache'
        required: false
        default: 'true'

env:
  # Cloud Run service URL (update if different)
  CLOUD_RUN_URL: https://agent-gujarat-tsr-642363716512.asia-south1.run.app
  GCS_CACHE_BUCKET: neon-alcove-479309-q3-tsr-cache

jobs:
  clear-cache:
    name: Clear GCS Cache
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for comparison

      - name: Get commit info
        id: commit_info
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Clear DOCX Cache via Cloud Run API
        id: clear_cache
        run: |
          echo "🧹 Clearing DOCX cache for commit: ${{ steps.commit_info.outputs.short_sha }}"
          
          # Call the Cloud Run API to clear cache (if endpoint exists)
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"commit_sha": "${{ github.sha }}"}' \
            "${{ env.CLOUD_RUN_URL }}/clear-docx-cache" 2>/dev/null || echo "000")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Cache cleared successfully via API"
            echo "Response: $BODY"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "⚠️ Cache clear endpoint not found. Using gsutil fallback..."
            # Fallback: Use gsutil to clear DOCX files directly
            gsutil -m rm -r "gs://${{ env.GCS_CACHE_BUCKET }}/cache/**/tsr.docx" 2>/dev/null || echo "No DOCX files to clear or bucket not accessible"
            
            # Update version file in bucket
            echo "${{ github.sha }}" | gsutil cp - "gs://${{ env.GCS_CACHE_BUCKET }}/deployed_version.txt"
            echo "✅ Cache cleared via gsutil and version updated"
          else
            echo "⚠️ Unexpected response (HTTP $HTTP_CODE). Attempting gsutil fallback..."
            gsutil -m rm -r "gs://${{ env.GCS_CACHE_BUCKET }}/cache/**/tsr.docx" 2>/dev/null || echo "No DOCX files to clear"
          fi

      - name: Notify Streamlit Cloud to reboot (optional)
        if: success()
        continue-on-error: true
        run: |
          # Streamlit Cloud automatically syncs with GitHub
          # This step just logs the action for visibility
          echo "📱 Streamlit Cloud will automatically sync changes from GitHub"
          echo "   Commit: ${{ steps.commit_info.outputs.short_sha }}"
          echo "   Message: ${{ steps.commit_info.outputs.message }}"
          
          # If you have Streamlit Cloud API access, you can trigger a reboot here
          # curl -X POST "https://api.streamlit.io/v1/apps/$STREAMLIT_APP_ID/reboot" \
          #   -H "Authorization: Bearer ${{ secrets.STREAMLIT_API_TOKEN }}"

      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.commit_info.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ steps.commit_info.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Status**: Cleared ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Cloud Build will deploy to Cloud Run automatically" >> $GITHUB_STEP_SUMMARY
          echo "2. Streamlit Cloud will sync and restart the app" >> $GITHUB_STEP_SUMMARY

  # Optional: Trigger Cloud Build if not using automatic triggers
  trigger-cloud-build:
    name: Trigger Cloud Build (if needed)
    runs-on: ubuntu-latest
    needs: clear-cache
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_clear == 'true'
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Trigger Cloud Build
        run: |
          echo "🏗️ Triggering Cloud Build..."
          gcloud builds submit --config=cloudbuild.yaml . || echo "Cloud Build trigger may already be configured"
