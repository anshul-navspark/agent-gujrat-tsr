name: CI

# Runs the test suite automatically so broken code is caught before it lands
# on main (and before it can auto-deploy to Cloud Run via cloudbuild.yaml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}   # allows a manual run from the Actions tab

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # The suite is fully mocked (no real network/LLM calls). core/config.py no
      # longer requires this key (2026-08-27: it was a hard startup dependency on
      # a key nobody has), but a dummy value is still needed: JSONTranslationSystem
      # (utils/json_translations.py) builds a ChatGoogleGenerativeAI eagerly in its
      # __init__, and pydantic rejects an empty api_key -- so TranslationService
      # cannot even be constructed without one. That breaks 8 tests + 2 errors in
      # test_services / test_api / test_http_fetch / test_spelling_equivalence,
      # none of which actually call an LLM. Drop this block once that client is
      # made lazy.
      GEMINI_API_KEY: ci-dummy-key-not-real
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Integration tests need external services (AnyRoR, real LLMs) and are
        # excluded here; everything else runs on every push/PR.
        run: pytest -m "not integration" -q

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `.env` was tracked from the initial commit until 2026-08-27 and carried four
      # Gemini keys. Those are revoked and history is deliberately NOT being rewritten
      # (see docs/journal.md, 2026-08-27), so a full-history scan would fail forever on
      # inert values and quickly get ignored. We scan the WORKING TREE instead: that is
      # the control that matters, because any newly committed secret lands there.
      - name: Install gitleaks
        run: |
          VER=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks dir . --no-banner --redact --verbose
