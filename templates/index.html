<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Records TSR Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Land Records TSR Generator</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Step 1: Fetch AnyRoR Data</h5>
                    </div>
                    <div class="card-body">
                        <form id="anyror-form">
                            <div class="mb-3">
                                <label for="district" class="form-label">District (જીલ્લો)</label>
                                <input type="text" class="form-control" id="district" name="district" required>
                            </div>
                            <div class="mb-3">
                                <label for="taluka" class="form-label">Taluka (તાલુકો)</label>
                                <input type="text" class="form-control" id="taluka" name="taluka" required>
                            </div>
                            <div class="mb-3">
                                <label for="village" class="form-label">Village (ગામ)</label>
                                <input type="text" class="form-control" id="village" name="village" required>
                            </div>
                            <div class="mb-3">
                                <label for="survey_block" class="form-label">Survey/Block Number</label>
                                <input type="text" class="form-control" id="survey_block" name="survey_block" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="fetch-btn">Fetch Land Record</button>
                            </div>
                        </form>
                        <div class="mt-3" id="anyror-status"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Step 2: Generate TSR Document</h5>
                    </div>
                    <div class="card-body">
                        <form id="tsr-form">
                            <div class="mb-3">
                                <label for="pdf_file" class="form-label">Upload PDF (Optional, if not fetched from AnyRoR)</label>
                                <input type="file" class="form-control" id="pdf_file" name="pdf_file" accept=".pdf">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success" id="generate-btn">Generate TSR Document</button>
                            </div>
                        </form>
                        <div class="mt-3" id="tsr-status"></div>
                    </div>
                </div>
                
                <div class="card mt-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Downloads</h5>
                    </div>
                    <div class="card-body">
                        <div id="downloads-area">
                            <p>Generated files will appear here for download.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
